version: '3.8'

services:
  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: mcp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp_network

  # Redis In-Memory Cache Store
  redis:
    image: redis:7-alpine
    container_name: mcp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp_network

  # Official Model Context Protocol (MCP) Server
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp_tools_server
    restart: unless-stopped
    environment:
      - PORT=8001
      - HOST=0.0.0.0
      - DOCUMENTS_DIR=/app/data/documents
    volumes:
      - shared_documents:/app/data/documents
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp_network

  # FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcp_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_chatbot}
      - REDIS_URL=redis://redis:6379/0
      - MCP_SERVER_URL=http://mcp_server:8001/sse
      - MCP_SERVER_EXEC_URL=http://mcp_server:8001/api/tools/execute
      - DOCUMENTS_DIR=/app/data/documents
      - SECRET_KEY=${SECRET_KEY:-mcp-secret-key-32-chars-long-abc}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openrouter}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai/gpt-4o-mini}
      - DEFAULT_TEMPERATURE=0.7
      - DEFAULT_MAX_TOKENS=2048
      - DEFAULT_MEMORY_WINDOW=10
    volumes:
      - shared_documents:/app/data/documents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mcp_network

  # React Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mcp_network

volumes:
  postgres_data:
  redis_data:
  shared_documents:

networks:
  mcp_network:
    driver: bridge

